name: Publish desktop installers

on:
  release:
    types:
      - published
  # Manual runs and desktop-affecting pull requests build the same installers
  # without publishing them, so a broken Tauri build is caught before a tag is
  # cut rather than after the release is already public.
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.jsx'
      - '.github/workflows/build-desktop-installers.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact_name: macos-dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: nsis
            artifact_name: windows-exe
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload installer to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ${{ matrix.artifact_path }} --clobber
