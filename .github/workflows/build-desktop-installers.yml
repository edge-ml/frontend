name: Publish desktop installers

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact_name: macos-dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: nsis
            artifact_name: windows-exe
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Create macOS disk image
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          version="$(node -p \"require('./src-tauri/tauri.conf.json').version\")"
          test -n "$app_path"
          hdiutil create \
            -volname 'edge-ml Explorer' \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "src-tauri/target/release/bundle/dmg/edge-ml-explorer-${version}-macos.dmg"

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ${{ matrix.artifact_path }} --clobber
