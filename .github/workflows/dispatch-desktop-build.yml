name: Trigger desktop build

# The desktop apps are built and released from the edge-ml superproject, but the
# Tauri app lives here, so a push to a release channel here has to ask the
# superproject to rebuild.
on:
  push:
    branches:
      - main
      - beta

jobs:
  dispatch:
    name: Ask the superproject to rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          # A PAT (or app token) with `contents: write` on edge-ml/edge-ml.
          # The default GITHUB_TOKEN is scoped to this repository and cannot
          # trigger a workflow in another one.
          TOKEN: ${{ secrets.SUPERPROJECT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SUPERPROJECT_DISPATCH_TOKEN is not set; skipping the desktop rebuild."
            echo "Add the secret, or run the Desktop apps workflow in edge-ml/edge-ml manually."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/edge-ml/edge-ml/dispatches \
            -d "{\"event_type\":\"frontend-push\",\"client_payload\":{\"channel\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Requested a desktop rebuild of the ${GITHUB_REF_NAME} channel."
