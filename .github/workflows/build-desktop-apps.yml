name: Desktop apps

# The desktop app is this repository: everything else in edge-ml is server
# hosted, so the installers are built and released from here.
#
# Two channels, released on every push to their branch:
#   main -> "edge-ml"       on the `latest` tag
#   beta -> "edge-ml beta"  on the `beta` tag (prerelease)
# They install side by side, because each channel builds with its own
# productName and identifier.
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve channel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      title: ${{ steps.pick.outputs.title }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
      config: ${{ steps.pick.outputs.config }}
      slug: ${{ steps.pick.outputs.slug }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so the previous release versions (v* tags) are visible.
          fetch-depth: 0

      - name: Pick the channel
        id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "tag=latest"                           >> "$GITHUB_OUTPUT"
              echo "title=edge-ml"                        >> "$GITHUB_OUTPUT"
              echo "prerelease=false"                     >> "$GITHUB_OUTPUT"
              echo "config="                              >> "$GITHUB_OUTPUT"
              echo "slug=edge-ml"                         >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "tag=beta"                             >> "$GITHUB_OUTPUT"
              echo "title=edge-ml beta"                   >> "$GITHUB_OUTPUT"
              echo "prerelease=true"                      >> "$GITHUB_OUTPUT"
              echo "config=src-tauri/tauri.beta.conf.json" >> "$GITHUB_OUTPUT"
              echo "slug=edge-ml-beta"                    >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Only the two channels publish, so a dispatch from a feature
              # branch cannot overwrite a release.
              echo "Refusing to build '${GITHUB_REF_NAME}'; only main and beta are release channels." >&2
              exit 1
              ;;
          esac

      # A merge to main is a release, so main must carry a version that has not
      # shipped before. Checked here rather than in build so a missing bump fails
      # in seconds instead of after a 15 minute compile.
      - name: Resolve and gate the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared version: $version"

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "beta build; no version gate (beta is a rolling prerelease of the next version)."
            exit 0
          fi

          previous=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$previous" ]; then
            echo "no previous v* tag; accepting $version as the first versioned release."
            exit 0
          fi
          echo "previous released version: $previous"

          highest=$(printf '%s\n%s\n' "$previous" "$version" | sort -V | tail -1)
          if [ "$version" = "$previous" ] || [ "$highest" != "$version" ]; then
            echo "::error::src-tauri/tauri.conf.json still declares $version, which is not newer than the last release ($previous). Bump it in the beta -> main PR: patch for fixes, minor for user-visible changes, major for a breaking change."
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact_name: windows-exe
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            artifact_name: macos-dmg
            artifact_glob: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ needs.resolve.outputs.slug }}

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        shell: bash
        run: |
          extra=""
          if [ -n "${{ needs.resolve.outputs.config }}" ]; then
            extra="--config ${{ needs.resolve.outputs.config }}"
          fi
          npm run tauri build -- --bundles ${{ matrix.bundle }} $extra

      - name: Upload installer for the release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish ${{ needs.resolve.outputs.title }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      # Version-free asset names: a rolling release is only useful if
      # /releases/<tag>/download/<name> keeps resolving across builds.
      - name: Collect assets under stable names
        id: assets
        run: |
          mkdir -p dist
          exe=$(find installers -name '*.exe' | head -1)
          dmg=$(find installers -name '*.dmg' | head -1)
          [ -n "$exe" ] || { echo "no .exe produced"; exit 1; }
          [ -n "$dmg" ] || { echo "no .dmg produced"; exit 1; }
          slug='${{ needs.resolve.outputs.slug }}'
          cp "$exe" "dist/${slug}-setup-x64.exe"
          cp "$dmg" "dist/${slug}-aarch64.dmg"
          echo "built=$(basename "$exe"), $(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - name: Move the channel tag to this commit
        run: |
          git tag -f "${{ needs.resolve.outputs.tag }}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${{ needs.resolve.outputs.tag }}"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TITLE: ${{ needs.resolve.outputs.title }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          BUILT: ${{ steps.assets.outputs.built }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Assets are deliberately version-free so the download URLs stay stable,
          # so the version is recorded here and in the vX.Y.Z tag instead.
          if [ "$PRERELEASE" = "true" ]; then
            display="${VERSION}-beta+${GITHUB_SHA:0:7}"
          else
            display="${VERSION}"
          fi
          notes=$(printf '%s\n' \
            "**Version ${display}**" \
            "" \
            "Desktop build of **${TITLE}** from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`." \
            "" \
            "Built artifacts: ${BUILT}" \
            "" \
            "\`edge-ml\` and \`edge-ml beta\` install side by side." \
            "" \
            "Not code signed yet, so Windows SmartScreen and macOS Gatekeeper warn on first run.")
          # `gh release edit` has no --target; the release follows the tag, which
          # the previous step already force-moved to this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$notes" --prerelease="$PRERELEASE"
          else
            extra=""
            if [ "$PRERELEASE" = "true" ]; then extra="--prerelease"; fi
            gh release create "$TAG" --title "$TITLE" --notes "$notes" --target "$GITHUB_SHA" $extra
          fi
          gh release upload "$TAG" dist/* --clobber

      # The channel tags (`latest` / `beta`) move every build, so stable releases
      # also get an immutable vX.Y.Z tag. Any past build can be reproduced by
      # dispatching this workflow at its tag.
      - name: Tag the released version
        if: needs.resolve.outputs.prerelease == 'false'
        run: |
          version="v${{ needs.resolve.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::$version is already tagged; the version was not bumped for this release."
            exit 1
          fi
          git tag -a "$version" -m "$version" "${GITHUB_SHA}"
          git push origin "refs/tags/$version"
